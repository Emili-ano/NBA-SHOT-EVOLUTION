[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-shot-iq"
version = "0.1.0"
description = "Proyecto academico de ingenieria de datos sobre tiros NBA"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "psutil>=5.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
